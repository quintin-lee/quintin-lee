name: GitHub-Metrics-Achievements

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-achievements.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          
      - name: Update README with Achievements
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin main
          # This step is just to ensure the file is generated, 
          # Metrics action handles its own output usually, 
          # but we want to display it in README.
          # The image will be at: github-metrics-achievements.svg
          sed -i 's|<!-- START_SECTION:achievements -->.*<!-- END_SECTION:achievements -->|<!-- START_SECTION:achievements -->\n<img src=\"github-metrics-achievements.svg\" />\n<!-- END_SECTION:achievements -->|' README.md
          git add README.md github-metrics-achievements.svg || echo "No changes"
          git commit -m "chore: update achievements metrics" || echo "No changes to commit"
          git push
