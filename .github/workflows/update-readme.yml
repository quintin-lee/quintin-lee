name: Update README

on:
  schedule:
    - cron: '0 0 * * *'  # 每天午夜运行
  workflow_dispatch:  # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update README
        run: |
          python3 -c "
          import requests
          import re
          repos = requests.get('https://api.github.com/users/quintin-lee/repos').json()
          non_fork = [r for r in repos if not r['fork']]
          sorted_repos = sorted(non_fork, key=lambda x: x['updated_at'], reverse=True)[:7]
          projects_lines = []
          for r in sorted_repos:
              desc = r.get('description') or 'No description'
              projects_lines.append(f'- [{r[\"name\"]}]({r[\"html_url\"]}): {desc}')
          projects_section = '\n'.join(projects_lines)
          with open('README.md', 'r') as f:
              content = f.read()
          new_content = re.sub(
              r'<!-- START_SECTION:projects -->.*?<!-- END_SECTION:projects -->',
              f'<!-- START_SECTION:projects -->\n{projects_section}\n<!-- END_SECTION:projects -->',
              content,
              flags=re.DOTALL
          )
          with open('README.md', 'w') as f:
              f.write(new_content)
          "
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git pull --rebase origin main
          git commit -m "Update latest projects" || echo "No changes to commit"
          git push