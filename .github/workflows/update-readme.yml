name: Update README

on:
  schedule:
    - cron: '0 0 * * *'  # 每天午夜运行
  workflow_dispatch:  # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update README
        run: |
          python3 -c "
          import requests
          import re
          import datetime

          def fetch_projects():
              repos = requests.get('https://api.github.com/users/quintin-lee/repos').json()
              non_fork = [r for r in repos if not r['fork']]
              sorted_repos = sorted(non_fork, key=lambda x: x['updated_at'], reverse=True)[:7]
              return '\n'.join([f'- [{r[\"name\"]}]({r[\"html_url\"]}): {r.get(\"description\") or \"No description\"}' for r in sorted_repos])

          def fetch_activity():
              events = requests.get('https://api.github.com/users/quintin-lee/events/public').json()
              activity_list = []
              seen_repos = set() # For deduplication
              
              for event in events:
                  created_at = datetime.datetime.strptime(event['created_at'], '%Y-%m-%dT%H:%M:%SZ').strftime('%Y-%m-%d')
                  etype = event['type']
                  repo_name = event['repo']['name']
                  repo_url = f'https://github.com/{repo_name}'
                  
                  # Deduplicate same event type on same repo in a short window
                  unique_key = (etype, repo_name)
                  if unique_key in seen_repos: continue
                  
                  if etype == 'PushEvent':
                      # Count distinct commits across all pushes in this event if multiple
                      commits = event['payload'].get('size', 0)
                      if commits == 0: continue # Skip empty pushes (tags etc)
                      activity_list.append(f'- 🚀 Pushed {commits} commit(s) to [{repo_name}]({repo_url}) ({created_at})')
                  elif etype == 'PullRequestEvent':
                      action = event['payload']['action']
                      activity_list.append(f'- 🔀 {action.capitalize()} PR in [{repo_name}]({repo_url}) ({created_at})')
                  elif etype == 'CreateEvent':
                      ref_type = event['payload']['ref_type']
                      activity_list.append(f'- ✨ Created {ref_type} in [{repo_name}]({repo_url}) ({created_at})')
                  elif etype == 'WatchEvent':
                      activity_list.append(f'- ⭐ Starred [{repo_name}]({repo_url}) ({created_at})')
                  
                  if len(activity_list) > 0:
                      seen_repos.add(unique_key)
                  
                  if len(activity_list) >= 5: break
              return '\n'.join(activity_list) if activity_list else 'No recent public activity.'

          with open('README.md', 'r') as f:
              content = f.read()

          # Update Projects
          projects_data = fetch_projects()
          content = re.sub(r'<!-- START_SECTION:projects -->.*?<!-- END_SECTION:projects -->', 
                          f'<!-- START_SECTION:projects -->\n{projects_data}\n<!-- END_SECTION:projects -->', 
                          content, flags=re.DOTALL)

          # Update Activity
          activity_data = fetch_activity()
          content = re.sub(r'<!--START_SECTION:activity-->.*?<!--END_SECTION:activity-->', 
                          f'<!--START_SECTION:activity-->\n{activity_data}\n<!--END_SECTION:activity-->', 
                          content, flags=re.DOTALL)

          with open('README.md', 'w') as f:
              f.write(content)
          "
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git pull --rebase origin main
          git commit -m "Update latest projects" || echo "No changes to commit"
          git push