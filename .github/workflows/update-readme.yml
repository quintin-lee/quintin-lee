name: Update README

on:
  schedule:
    - cron: '30 0 * * *'  # 每天 00:30 UTC 运行，避免与 quotes.yml (00:00) 冲突
  workflow_dispatch:  # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import json, os, re, sys
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          TOKEN = os.environ.get('GH_TOKEN', '')
          HEADERS = {
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          if TOKEN:
              HEADERS['Authorization'] = f'Bearer {TOKEN}'

          def gh_api(path):
              url = f'https://api.github.com{path}'
              req = Request(url, headers=HEADERS)
              try:
                  with urlopen(req) as resp:
                      return json.loads(resp.read().decode())
              except HTTPError as e:
                  print(f'API error {e.code} for {url}: {e.read().decode()[:200]}', file=sys.stderr)
                  return None

          repos = gh_api('/users/quintin-lee/repos?per_page=100')
          if not isinstance(repos, list):
              print('ERROR: projects API returned:', type(repos).__name__)
              sys.exit(0)
          non_fork = [r for r in repos if not r.get('fork', False)]
          sorted_repos = sorted(non_fork, key=lambda x: x.get('updated_at', ''), reverse=True)[:7]
          projects_data = '\n'.join([f'- [{r[\"name\"]}]({r[\"html_url\"]}): {r.get(\"description\") or \"No description\"}' for r in sorted_repos])

          with open('README.md', 'r') as f:
              content = f.read()
          content = re.sub(r'<!-- START_SECTION:projects -->.*?<!-- END_SECTION:projects -->',
                          f'<!-- START_SECTION:projects -->\n{projects_data}\n<!-- END_SECTION:projects -->',
                          content, flags=re.DOTALL)
          with open('README.md', 'w') as f:
              f.write(content)
          print('Updated projects:', len(sorted_repos), 'repos')
          "

      - name: Update Activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import json, os, re, sys
          from datetime import datetime
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          TOKEN = os.environ.get('GH_TOKEN', '')
          HEADERS = {
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          if TOKEN:
              HEADERS['Authorization'] = f'Bearer {TOKEN}'

          def gh_api(path):
              url = f'https://api.github.com{path}'
              req = Request(url, headers=HEADERS)
              try:
                  with urlopen(req) as resp:
                      return json.loads(resp.read().decode())
              except HTTPError as e:
                  print(f'API error {e.code} for {url}: {e.read().decode()[:200]}', file=sys.stderr)
                  return None

          events = gh_api('/users/quintin-lee/events?per_page=30')
          if not isinstance(events, list):
              print('ERROR: events API returned:', type(events).__name__)
              sys.exit(0)

          activity_list = []
          seen_repos = set()
          for event in events:
              try:
                  created_at = datetime.strptime(event['created_at'], '%Y-%m-%dT%H:%M:%SZ').strftime('%Y-%m-%d')
                  etype = event['type']
                  repo_name = event['repo']['name']
                  repo_url = f'https://github.com/{repo_name}'
                  unique_key = (etype, repo_name)
                  payload = event.get('payload', {})
                  if etype == 'PushEvent':
                      if unique_key in seen_repos: continue
                      commits = payload.get('size') or payload.get('distinct_size') or 0
                      if commits > 0:
                          activity_list.append(f'- 🚀 Pushed {commits} commit(s) to [{repo_name}]({repo_url}) ({created_at})')
                      else:
                          activity_list.append(f'- 🚀 Pushed to [{repo_name}]({repo_url}) ({created_at})')
                  elif etype == 'PullRequestEvent':
                      if unique_key in seen_repos: continue
                      action = payload.get('action', 'updated')
                      activity_list.append(f'- 🔀 {action.capitalize()} PR in [{repo_name}]({repo_url}) ({created_at})')
                  elif etype == 'CreateEvent':
                      if unique_key in seen_repos: continue
                      ref_type = payload.get('ref_type', 'ref')
                      activity_list.append(f'- ✨ Created {ref_type} in [{repo_name}]({repo_url}) ({created_at})')
                  elif etype == 'WatchEvent':
                      if unique_key in seen_repos: continue
                      activity_list.append(f'- ⭐ Starred [{repo_name}]({repo_url}) ({created_at})')
                  elif etype == 'ForkEvent':
                      if unique_key in seen_repos: continue
                      activity_list.append(f'- 🍴 Forked [{repo_name}]({repo_url}) ({created_at})')
                  elif etype == 'IssuesEvent':
                      if unique_key in seen_repos: continue
                      action = payload.get('action', 'updated')
                      activity_list.append(f'- 🐛 {action.capitalize()} issue in [{repo_name}]({repo_url}) ({created_at})')
                  elif etype == 'IssueCommentEvent':
                      if unique_key in seen_repos: continue
                      activity_list.append(f'- 💬 Commented on issue in [{repo_name}]({repo_url}) ({created_at})')
                  if activity_list:
                      seen_repos.add(unique_key)
                  if len(activity_list) >= 5:
                      break
              except Exception as e:
                  print(f'Event parse error: {e}', file=sys.stderr)
          activity_data = '\n'.join(activity_list) if activity_list else 'No recent public activity.'

          with open('README.md', 'r') as f:
              content = f.read()
          content = re.sub(r'<!--START_SECTION:activity-->.*?<!--END_SECTION:activity-->',
                          f'<!--START_SECTION:activity-->\n{activity_data}\n<!--END_SECTION:activity-->',
                          content, flags=re.DOTALL)
          with open('README.md', 'w') as f:
              f.write(content)
          print('Updated activity:', len(activity_list), 'items')
          "

      - name: Update Achievements
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import json, os, re, sys
          from datetime import datetime, timezone
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          TOKEN = os.environ.get('GH_TOKEN', '')
          HEADERS = {
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          if TOKEN:
              HEADERS['Authorization'] = f'Bearer {TOKEN}'

          def gh_api(path):
              url = f'https://api.github.com{path}'
              req = Request(url, headers=HEADERS)
              try:
                  with urlopen(req) as resp:
                      return json.loads(resp.read().decode())
              except HTTPError as e:
                  print(f'API error {e.code} for {url}: {e.read().decode()[:200]}', file=sys.stderr)
                  return None

          user = gh_api('/users/quintin-lee')
          repos = gh_api('/users/quintin-lee/repos?per_page=100')
          if not isinstance(user, dict):
              print('ERROR: user API returned:', type(user).__name__)
              sys.exit(0)
          if not isinstance(repos, list):
              print('ERROR: repos API returned:', type(repos).__name__)
              sys.exit(0)

          total_stars = sum(r.get('stargazers_count', 0) for r in repos)
          public_repos = user.get('public_repos', 0)
          followers = user.get('followers', 0)

          year_ago = datetime.now(timezone.utc).replace(year=datetime.now(timezone.utc).year - 1).strftime('%Y-%m-%dT%H:%M:%S')
          search_query = f'author:quintin-lee author-date:>={year_ago}'
          search_res = gh_api(f'/search/commits?q={quote(search_query)}&per_page=1')
          total_commits = search_res.get('total_count', 0) if isinstance(search_res, dict) else 0

          achievements_data = (
              f'<p>'
              f'<img src=\"https://img.shields.io/badge/Total%20Stars-{total_stars}-yellow?style=flat-square&logo=github\" /> '
              f'<img src=\"https://img.shields.io/badge/Public%20Repos-{public_repos}-blue?style=flat-square&logo=github\" /> '
              f'<img src=\"https://img.shields.io/badge/Followers-{followers}-green?style=flat-square&logo=github\" /> '
              f'<img src=\"https://img.shields.io/badge/Commits%20(Year)-{total_commits}-purple?style=flat-square&logo=git\" /> '
              f'</p>'
          )

          with open('README.md', 'r') as f:
              content = f.read()
          content = re.sub(r'<!-- START_SECTION:achievements -->.*?<!-- END_SECTION:achievements -->',
                          f'<!-- START_SECTION:achievements -->\n{achievements_data}\n<!-- END_SECTION:achievements -->',
                          content, flags=re.DOTALL)
          with open('README.md', 'w') as f:
              f.write(content)
          print('Updated achievements: stars={}, repos={}, followers={}, commits={}'.format(total_stars, public_repos, followers, total_commits))
          "
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git stash
          git pull --rebase origin main
          git stash pop
          git commit -m "Update latest projects" || echo "No changes to commit"
          git push